[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
addopts = -ra
markers =
    unit: fast isolated unit tests (no DB, no network, no AI models)
    integration: cross-component tests exercising the FastAPI app + SQLite DB
    requires_models: needs real AI models (Whisper/LeNER/Ollama/PyAnnote); skipped automatically when unavailable
    slow: long-running tests (model loading, audio processing)
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning
