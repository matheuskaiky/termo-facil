name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    env:
      # config.py requires these at import time (no insecure defaults).
      APP_ENV: test
      TEST_AI_MODE: mock            # real models (Whisper/LeNER/Ollama) run on the HPC, not CI
      JWT_SECRET_KEY: ci-test-secret-key
      POSTGRES_PASSWORD: ci-test-password
      MINIO_ACCESS_KEY: ci-test-access
      MINIO_SECRET_KEY: ci-test-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Run test suite (mock AI, excluding model-dependent tests)
        working-directory: backend
        run: python -m pytest -m "not requires_models" --cov=app --cov-report=term-missing

  frontend-tests:
    name: Frontend (Karma + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Chrome (headless)
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Unit tests (ChromeHeadless)
        working-directory: frontend
        env:
          CHROME_BIN: chrome
        run: npm run test:ci

      - name: Production build
        working-directory: frontend
        run: npm run build
