<div class="auth-page">
  <div class="auth-wrapper">

    <div class="auth-branding">
      <div class="auth-logo-row">
        <div class="auth-logo-mark">TF</div>
        <span class="auth-logo-name">Termo Fácil</span>
      </div>
      <span class="auth-badge">SSP-PI</span>
    </div>

    <div class="auth-card">
      <div class="auth-card-header">
        <h2>Troca de Senha Obrigatória</h2>
        <p>Uma senha temporária foi definida para sua conta. Crie uma nova senha para continuar.</p>
      </div>

      <div class="warning-notice">
        <strong>Ação obrigatória antes de continuar</strong>
        Esta é a sua primeira autenticação ou um administrador redefiniu sua senha.
      </div>

      <form (ngSubmit)="onSubmit()" class="auth-form">

        <div class="form-group">
          <label class="form-label">
            Nova Senha <span class="form-label-hint">(mínimo 8 caracteres)</span>
          </label>
          <input
            type="password"
            [(ngModel)]="novaSenha"
            name="novaSenha"
            placeholder="••••••••"
            required
            autocomplete="new-password"
            class="form-input"
          />
        </div>

        <div class="form-group form-group-last">
          <label class="form-label">Confirmar Nova Senha</label>
          <input
            type="password"
            [(ngModel)]="confirmar"
            name="confirmar"
            placeholder="••••••••"
            required
            autocomplete="new-password"
            class="form-input"
            [class.is-invalid]="senhasNaoConferem"
          />
          <p *ngIf="senhasNaoConferem" class="input-error-msg">As senhas não conferem.</p>
        </div>

        <div *ngIf="erro" class="alert-error">{{ erro }}</div>

        <button
          type="submit"
          [disabled]="!podeSalvar"
          class="btn-auth"
        >
          {{ carregando ? 'Salvando...' : 'Definir Nova Senha' }}
        </button>

      </form>
    </div>

  </div>
</div>
