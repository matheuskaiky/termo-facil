<div style="min-height: 100vh; background-color: #F7FAFC; display: flex; align-items: center; justify-content: center;">
  <div style="width: 100%; max-width: 440px; padding: 1rem;">

    <div style="text-align: center; margin-bottom: 2rem;">
      <div style="display: flex; align-items: center; justify-content: center; gap: 0.75rem; margin-bottom: 0.5rem;">
        <span style="font-size: 2rem;">🔐</span>
        <span style="font-size: 1.6rem; font-weight: 800; color: var(--color-primary);">Termo Fácil</span>
      </div>
      <span style="font-size: 0.75rem; background-color: var(--color-accent); color: white; padding: 3px 10px; border-radius: 20px; font-weight: bold; text-transform: uppercase;">SSP-PI</span>
    </div>

    <div style="background: white; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); border: 1px solid #E2E8F0; overflow: hidden;">

      <div style="background-color: #D97706; padding: 1.25rem 1.75rem;">
        <h2 style="margin: 0; color: white; font-size: 1.1rem; font-weight: 700;">Troca de Senha Obrigatória</h2>
        <p style="margin: 0.25rem 0 0; color: rgba(255,255,255,0.85); font-size: 0.82rem;">
          Uma senha temporária foi definida para sua conta. Crie uma nova senha para continuar.
        </p>
      </div>

      <form (ngSubmit)="onSubmit()" style="padding: 1.75rem;">

        <div style="margin-bottom: 1.25rem;">
          <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #4A5568; margin-bottom: 0.4rem;">
            Nova Senha <span style="color: #718096; font-weight: 400;">(mínimo 8 caracteres)</span>
          </label>
          <input
            type="password"
            [(ngModel)]="novaSenha"
            name="novaSenha"
            placeholder="••••••••"
            required
            autocomplete="new-password"
            class="login-input"
          />
        </div>

        <div style="margin-bottom: 1.5rem;">
          <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #4A5568; margin-bottom: 0.4rem;">
            Confirmar Nova Senha
          </label>
          <input
            type="password"
            [(ngModel)]="confirmar"
            name="confirmar"
            placeholder="••••••••"
            required
            autocomplete="new-password"
            class="login-input"
            [style.borderColor]="senhasNaoConferem ? '#FC8181' : ''"
          />
          <p *ngIf="senhasNaoConferem" style="margin: 0.3rem 0 0; font-size: 0.8rem; color: #C53030;">
            As senhas não conferem.
          </p>
        </div>

        <div *ngIf="erro" style="background-color: #FFF5F5; border: 1px solid #FEB2B2; border-radius: 5px; padding: 0.65rem 0.85rem; margin-bottom: 1.25rem; color: #C53030; font-size: 0.85rem;">
          {{ erro }}
        </div>

        <button
          type="submit"
          [disabled]="!podeSalvar"
          class="btn-submit"
          [class.btn-disabled]="!podeSalvar"
        >
          {{ carregando ? 'Salvando...' : 'Definir Nova Senha' }}
        </button>

      </form>
    </div>

  </div>
</div>

<style>
  .login-input {
    width: 100%;
    box-sizing: border-box;
    padding: 0.65rem 0.85rem;
    border: 1px solid #CBD5E0;
    border-radius: 5px;
    font-size: 0.95rem;
    color: #2D3748;
    outline: none;
    transition: border-color 0.2s;
  }
  .login-input:focus { border-color: var(--color-primary); }
  .btn-submit {
    width: 100%;
    padding: 0.75rem;
    background-color: #D97706;
    color: white;
    border: none;
    border-radius: 5px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.3px;
  }
  .btn-submit:hover:not(:disabled) { filter: brightness(1.1); }
  .btn-disabled { opacity: 0.6; cursor: not-allowed; }
</style>
