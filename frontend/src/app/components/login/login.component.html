<div class="auth-page">
  <div class="auth-wrapper">

    <div class="auth-branding">
      <div class="auth-logo-row">
        <div class="auth-logo-mark">TF</div>
        <span class="auth-logo-name">Termo Fácil</span>
      </div>
      <span class="auth-badge">SSP-PI</span>
      <p class="auth-tagline">Sistema de Gestão de Termos de Depoimento</p>
    </div>

    <div class="auth-card">
      <div class="auth-card-header">
        <h2>Acesso ao Sistema</h2>
        <p>Use sua matrícula funcional SSP-PI</p>
      </div>

      <form (ngSubmit)="onSubmit()" class="auth-form">

        <div class="form-group">
          <label class="form-label">Matrícula Funcional</label>
          <input
            type="text"
            [(ngModel)]="matricula"
            name="matricula"
            placeholder="Ex: 123456"
            required
            autocomplete="username"
            class="form-input"
          />
        </div>

        <div class="form-group form-group-last">
          <label class="form-label">Senha</label>
          <input
            type="password"
            [(ngModel)]="senha"
            name="senha"
            placeholder="••••••••"
            required
            autocomplete="current-password"
            class="form-input"
          />
        </div>

        <div *ngIf="erro" class="alert-error">{{ erro }}</div>

        <button
          type="submit"
          [disabled]="carregando || !matricula || !senha"
          class="btn-auth"
        >
          {{ carregando ? 'Autenticando...' : 'Entrar' }}
        </button>

      </form>
    </div>

    <p class="auth-footer">
      Secretaria de Segurança Pública do Piauí &mdash; Uso exclusivo de servidores autorizados
    </p>

  </div>
</div>
