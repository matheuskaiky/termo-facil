<header class="site-header">

  <div class="header-brand" routerLink="/processos">
    <div class="brand-mark">TF</div>
    <span class="brand-name">{{ title }}</span>
    <span class="brand-badge">SSP-PI</span>
  </div>

  <nav class="header-nav">
    <a routerLink="/processos" routerLinkActive="active-nav" class="nav-link">Processos</a>
    <a *ngIf="canManageUsers" routerLink="/admin" routerLinkActive="active-nav" class="nav-link">Painel Admin</a>
    <a *ngIf="canViewMetricas" routerLink="/metricas" routerLinkActive="active-nav" class="nav-link">Métricas</a>
  </nav>

  <div *ngIf="activeUser" class="header-user">
    <div class="user-info">
      <div class="user-name">{{ activeUser.nome }}</div>
      <div class="user-meta">
        <span>{{ activeUser.cargo }}</span>
        <span class="user-meta-sep">·</span>
        <span>Mat. {{ activeUser.matricula }}</span>
      </div>
    </div>
    <div class="user-avatar">{{ userInitials }}</div>
    <button (click)="logout()" class="btn-logout">Sair</button>
  </div>

</header>
